<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

<body>

    <div class="container">

        <h2 class="text-center"> Registration </h2>

        <form>


            <div class="row">

                <div class="col-md-6">

                    <label for="FirstName" class="form-label"> First Name: </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="name" 
                        name="FirstName" 
                        required>

                </div>
                

                <div class="col-md-6">

                    <label for="LastName" class="form-label"> Second Name: </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="LastName" 
                        name="LastName" 
                        required>

                </div>

            </div>

            <br>

            <div>

                <label for="Email" class="form-label"> Email: </label>
                <input 
                    type="email" 
                    class="form-control" 
                    id="Email" 
                    name="email" 
                    required>

            </div>

            <br>

            <div>

                <label for="Password" class="form-label"> Password </label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="Password" 
                    name="Password" 
                    minlength="8" 
                    required>

            </div>  

            <br>

            <div>

                <label for="CoPassword" class="form-label"> Confirm Password </label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="CoPassword" 
                    name="CoPassword" 
                    minlength="8" 
                    required>

            </div>

            <br>

            <div>

                <label class="form-label"> Gender </label>
                
                <div>


                    <input 
                        type="radio" 
                        id="male" 
                        name="Gender" 
                        value="male" 
                        required>

                    <label for="male"> Male </label>

                    <input 
                        type="radio" 
                        id="female" 
                        name="Gender" 
                        value="female">
                    
                    <label for="female"> Female </label>


                </div>

            </div>

            <br>

            <div>

                <label class="form-label"> Hobbies </label>

                <div>
                    <input 
                        type="checkbox" 
                        id="sport" 
                        name="Hobbies" 
                        value="sport">

                    <label for="Sport"> Sport </label>
                </div>

                <div>
                    <input 
                        type="checkbox" 
                        id="music" 
                        name="Hobbies" 
                        value="music">

                    <label for="Music"> Music </label>
                </div>
                
                <div>
                    <input 
                        type="checkbox" 
                        id="hobbyhorsing" 
                        name="Hobbies" 
                        value="hobbyhorsing">

                    <label for="hobbyhorsing"> Hobbyhorsing</label>
                </div>

            </div>

            <br>

            <div>

                <label for="Country" class="form-control"> Country </label>

                <select 
                    class="form-control" 
                    id="Country" 
                    name="Country" 
                    required>

                    <option value=""> Select your Country </option>
                    <option value="kazahkstan"> Kazahkstan </option>
                    <option value="USA"> USA </option>
                    <option value="Russia"> Russia </option>
                    <option value="Uzbekistan"> Uzbekistan </option>
                    <option value="Kyrgystan"> Kyrgystan </option>

                </select>


            </div>

            <br>

            <button type="submit" class="btn btn-primary"> Submit </button>

            <button type="reset" class="btn btn-secondary"> Reset </button>

        </form>

    </div>

</body>

<nav>
    <a href="index.html"> Contact Form </a>
    <a href="form.html"> Registration </a>
</nav>

</html>
